<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact me through the accessible portfolio contact form.">

    <title>Contact | My Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav aria-label="Main Navigation">

        <a href="index.html" class="logo">
            My Portfolio
        </a>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>

    </nav>

</header>

<main>

    <section class="page-section">

        <h1>Contact Me</h1>

        <p>
            Fill out the form below to get in touch with me.
        </p>

        <form id="contactForm" novalidate>

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                    aria-required="true"
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    aria-required="true"
                >

            </div>

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                    aria-required="true">
                </textarea>

            </div>

            <button type="submit">
                Send Message
            </button>

            <p
                id="formMessage"
                role="status"
                aria-live="polite">
            </p>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Your Name. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
